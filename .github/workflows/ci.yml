name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  # ─── Job 0a: Runtime version check (#576) ───────────────────────────────────
  runtime-check:
    name: Runtime Version Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify runtime versions
        run: bash scripts/check-engines.sh

      - name: Install root dependencies (frozen lockfile)
        run: yarn install --frozen-lockfile

      - name: Install backend dependencies (frozen lockfile)
        working-directory: apps/backend
        run: bun install --frozen-lockfile

      - name: Install web dependencies (frozen lockfile)
        working-directory: apps/web
        run: yarn install --frozen-lockfile

  # ─── Job 0b: Changelog & release validation (#575) ──────────────────────────
  release-validation:
    name: Changelog & Release Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate CHANGELOG.md
        run: bun run scripts/validate-changelog.ts

      - name: Verify generate-release-manifest runs cleanly
        run: bun run scripts/generate-release-manifest.ts --version 0.0.0-ci

      - name: Test release health gate (#737)
        run: bun test scripts/release-health-gate.test.ts

  # ─── Job 1: Validate migration filenames ────────────────────────────────────
  validate-migrations:
    name: Validate Migration Filenames
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install backend dependencies
        working-directory: apps/backend
        run: bun install --frozen-lockfile

      - name: Validate migration filenames
        working-directory: apps/backend
        run: bun run validate:migrations
        # This step exits 1 if any migration prefix is duplicated or out-of-order.
        # It documents the existing duplicates (00002, 00012, 00013, 00014, 00017)
        # which were already present before this check was added. Those files must
        # NOT be renamed. Only NEW migrations added after this check was introduced
        # are required to have unique, sequential prefixes.
        #
        # To acknowledge the existing duplicates and still enforce the rule on new
        # files, the script reports existing duplicates as warnings but new ones
        # cause a failure (the script always exits 1 on any duplicate for maximum
        # safety — see MIGRATIONS_NAMING.md for the canonical ordering).

  # ─── Job 2: Unit tests ───────────────────────────────────────────────────────
  # Covers all files under tests/unit/, including:
  #   - emailLayout.test.ts   (shared email layout — HTML wrapping, plaintext, escaping)
  #   - preferenceToken.test.ts (JWT generation/verification/URL helpers)
  #   - All pre-existing unit test files
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install backend dependencies
        working-directory: apps/backend
        run: bun install --frozen-lockfile

      - name: Run unit tests
        working-directory: apps/backend
        env:
          NODE_ENV: test
          SUPABASE_URL: http://localhost:54321
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
          JWT_SECRET: test_jwt_secret_min_32_chars_long
          PREF_TOKEN_SECRET: test_pref_token_secret_min_32_chars
          FRONTEND_URL: https://rentars.app
          CORS_ORIGIN: http://localhost:3001
          STELLAR_NETWORK: testnet
        run: bun run test:unit

  # ─── Job 3: Backend integration E2E tests ───────────────────────────────────
  # Drives the booking API (create → read → cancel → verify freed) against mocked
  # Supabase / TrustlessWork / email dependencies. No live infrastructure needed.
  backend-e2e:
    name: Backend E2E — Booking Lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install backend dependencies
        working-directory: apps/backend
        run: bun install --frozen-lockfile

      - name: Run backend E2E tests
        working-directory: apps/backend
        env:
          NODE_ENV: test
          SUPABASE_URL: https://mock.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: mock-service-role-key
          JWT_SECRET: test_jwt_secret_min_32_chars_long
          PREF_TOKEN_SECRET: test_pref_token_secret_min_32_chars
          FRONTEND_URL: https://rentars.app
          CORS_ORIGIN: http://localhost:3001
          STELLAR_NETWORK: testnet
          STELLAR_RPC_URL: https://soroban-testnet.stellar.org
          STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
          TRUSTLESS_WORK_API_URL: https://sandbox.trustlesswork.com
          TRUSTLESS_WORK_API_KEY: test-api-key
          REDIS_URL: ""
        run: bun test tests/integration/booking-e2e.test.ts

  # ─── Job 3b: OpenAPI contract tests (#826) ──────────────────────────────────
  # Compares live route samples (success + error fixtures) against the published
  # OpenAPI document at apps/backend/openapi.json. Any response shape or status
  # code that is not documented in the spec fails this job, blocking the merge.
  #
  # Local reproduction:
  #   cd apps/backend && bun run test:contract
  contract-tests:
    name: Backend — OpenAPI Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install backend dependencies
        working-directory: apps/backend
        run: bun install --frozen-lockfile

      - name: Run OpenAPI contract tests
        working-directory: apps/backend
        env:
          NODE_ENV: test
          SUPABASE_URL: https://mock.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: mock-service-role-key
          JWT_SECRET: test_jwt_secret_min_32_chars_long
          PREF_TOKEN_SECRET: test_pref_token_secret_min_32_chars
          FRONTEND_URL: https://rentars.app
          CORS_ORIGIN: http://localhost:3001
          STELLAR_NETWORK: testnet
          STELLAR_RPC_URL: https://soroban-testnet.stellar.org
          STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
          TRUSTLESS_WORK_API_URL: https://sandbox.trustlesswork.com
          TRUSTLESS_WORK_API_KEY: test-api-key
          REDIS_URL: ""
        run: bun run test:contract

  # ─── Job 4: RLS integration tests ───────────────────────────────────────────
  # Applies all migrations to a temporary PostgreSQL database and then runs RLS
  # policy tests. Migration failures and RLS failures both block this job.
  #
  # Failure modes are separated:
  #   - PostgreSQL service unreachable → infrastructure failure (not a SQL error)
  #   - SQL error during migration      → migration failure (blocks the build)
  #   - Supabase auth stack failure     → infrastructure failure
  #   - RLS assertion failure           → test failure (blocks the build)
  #
  # Local reproduction:
  #   docker run -e POSTGRES_PASSWORD=postgres -p 5432:5432 supabase/postgres:15.6.1.117
  #   cd apps/backend/database
  #   PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f setup.sql
  #   cd ../../..
  #   cd apps/backend && supabase start && bun run test:rls
  rls-tests:
    name: RLS Policy Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: supabase/postgres:15.6.1.117
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Supabase CLI
        run: |
          wget -qO- https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz | tar -xzf -
          sudo mv supabase /usr/local/bin/

      - name: Verify PostgreSQL infrastructure
        run: |
          if ! PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -c '\q' 2>/dev/null; then
            echo "::error::PostgreSQL service is unreachable — infrastructure failure, not a migration error."
            exit 1
          fi
          echo "PostgreSQL service is healthy."

      - name: Apply migrations to temporary database
        working-directory: apps/backend/database
        run: |
          set -euo pipefail
          # -v ON_ERROR_STOP=1 causes psql to abort immediately on any SQL error,
          # making a malformed migration fail this job with a non-zero exit code.
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 \
            -f setup.sql
          MIGRATION_COUNT=$(grep -c '^\\i' setup.sql)
          echo "MIGRATION_COUNT=$MIGRATION_COUNT" >> "$GITHUB_ENV"
          echo "Applied $MIGRATION_COUNT migration file(s) successfully."

      - name: Install backend dependencies
        working-directory: apps/backend
        run: bun install --frozen-lockfile

      - name: Start Supabase stack for RLS auth layer
        working-directory: apps/backend
        run: |
          set -euo pipefail
          supabase start --workdir . 2>&1 | tee /tmp/supabase_start.log || {
            echo "::error::Supabase stack failed to start — infrastructure failure. Review the log above."
            exit 1
          }
          timeout 120 bash -c \
            'until curl -sf http://localhost:54321/rest/v1/ > /dev/null 2>&1; do sleep 2; done' || {
            echo "::error::Supabase API did not become ready within 120 s — infrastructure timeout."
            exit 1
          }

      - name: Run RLS tests
        working-directory: apps/backend
        env:
          NODE_ENV: test
          SUPABASE_URL: http://localhost:54321
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRFA0NiK7W9fDQlUsleJbhUBCmFB9MpNZB8amTFZO7A
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
          JWT_SECRET: test_jwt_secret_min_32_chars_long
          CORS_ORIGIN: http://localhost:3001
          STELLAR_NETWORK: testnet
        run: |
          set -euo pipefail
          bun run test:rls 2>&1 | tee /tmp/rls_output.txt
          RLS_PASS=$(grep -cE 'pass|✓|\bok\b' /tmp/rls_output.txt || echo 0)
          echo "RLS_PASS=$RLS_PASS" >> "$GITHUB_ENV"

      - name: Emit job summary
        if: always()
        run: |
          {
            echo "## RLS & Migration Summary"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Migration files applied | ${MIGRATION_COUNT:-unknown} |"
            echo "| Authoritative migration directory | \`apps/backend/database/migrations\` |"
            echo "| RLS tests passing | ${RLS_PASS:-unknown} |"
            echo ""
            echo "**Local reproduction (same sequence as CI):**"
            echo "\`\`\`bash"
            echo "# 1. Start a temporary postgres instance"
            echo "docker run --rm -e POSTGRES_PASSWORD=postgres -p 5432:5432 supabase/postgres:15.6.1.117"
            echo ""
            echo "# 2. Apply all migrations (fails immediately on SQL error)"
            echo "cd apps/backend/database"
            echo "PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f setup.sql"
            echo ""
            echo "# 3. Run RLS tests (requires local Supabase stack for auth layer)"
            echo "cd apps/backend && supabase start && bun run test:rls"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ─── Job 5: Soroban contract builds and tests ───────────────────────────────
  # Compiles all Rust/Soroban contracts in release mode, runs unit tests, and
  # uploads WASM artifacts. Every pull request must pass this job.
  contracts:
    name: Contracts — Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain with WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Cache Cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/contracts/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        working-directory: apps/contracts
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: apps/contracts
        run: cargo clippy --all --all-targets -- -D warnings

      - name: Run contract unit tests
        working-directory: apps/contracts
        run: cargo test --all

      - name: Build WASM artifacts (release)
        working-directory: apps/contracts
        run: cargo build --target wasm32-unknown-unknown --release --all

      - name: Verify artifacts and record hashes
        working-directory: apps/contracts
        run: |
          set -euo pipefail
          WASM_DIR=target/wasm32-unknown-unknown/release
          {
            echo "## Contract Build Summary"
            echo ""
            echo "| Contract | SHA-256 |"
            echo "|----------|---------|"
          } >> "$GITHUB_STEP_SUMMARY"

          missing=()
          for wasm_file in "$WASM_DIR"/*.wasm; do
            if [[ -f "$wasm_file" ]]; then
              name=$(basename "$wasm_file")
              hash=$(sha256sum "$wasm_file" | awk '{print $1}')
              echo "| \`${name}\` | \`${hash}\` |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          # Verify that each workspace member produced a WASM artifact
          expected=(booking property_listing rentars_rental_contract rentars_review_contract)
          for name in "${expected[@]}"; do
            artifact="$WASM_DIR/${name}.wasm"
            if [[ ! -f "$artifact" ]]; then
              missing+=("$artifact")
            fi
          done

          if [[ ${#missing[@]} -gt 0 ]]; then
            {
              echo ""
              echo "### Missing artifacts"
              for f in "${missing[@]}"; do
                echo "- \`$f\`"
              done
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Missing expected WASM artifacts: ${missing[*]}"
            exit 1
          fi

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-contracts
          path: apps/contracts/target/wasm32-unknown-unknown/release/*.wasm
          if-no-files-found: error
          retention-days: 14

  # ─── Job 6: Frontend type check, lint, and unit tests ───────────────────────
  # Fast feedback on type errors, lint violations, and Vitest unit-test failures.
  # Runs on every push and pull request before the slower browser suite.
  frontend-checks:
    name: Frontend — Type Check, Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: apps/web/yarn.lock

      - name: Install web dependencies
        working-directory: apps/web
        run: yarn install --frozen-lockfile

      - name: TypeScript type check
        working-directory: apps/web
        run: yarn tsc --noEmit

      - name: Lint
        working-directory: apps/web
        run: yarn lint

      - name: Run Vitest unit tests
        working-directory: apps/web
        env:
          CI: true
        run: yarn test --run

  # ─── Job 7: Frontend E2E — browser matrix ───────────────────────────────────
  # On pull requests: Chromium only for fast feedback.
  # On push to protected branches: full matrix (Chromium + Firefox + WebKit +
  # mobile Chrome) for thorough coverage before merge to main.
  #
  # Trace, screenshot, and video artifacts are uploaded on failure so failures
  # can be reproduced and debugged without re-running CI.
  #
  # Local reproduction:
  #   cd apps/web
  #   yarn playwright test --project=chromium          # single browser
  #   yarn playwright test                             # full matrix
  frontend-e2e:
    name: Frontend E2E — ${{ matrix.project }}
    runs-on: ubuntu-latest
    needs: frontend-checks
    strategy:
      fail-fast: false
      matrix:
        project: ${{ github.event_name == 'push' && fromJSON('["chromium","firefox","webkit","mobile-chrome"]') || fromJSON('["chromium"]') }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: apps/web/yarn.lock

      - name: Install web dependencies
        working-directory: apps/web
        run: yarn install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: apps/web
        run: yarn playwright install --with-deps ${{ matrix.project == 'mobile-chrome' && 'chromium' || matrix.project }}

      - name: Build Next.js app
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://mock.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-anon-key
        run: yarn build

      - name: Run Playwright E2E tests
        working-directory: apps/web
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:3001
          NEXT_PUBLIC_API_URL: http://localhost:3000
          PORT: "3001"
        run: yarn playwright test --project=${{ matrix.project }}

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ matrix.project }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14

  # ─── Job 7b: Search rollout upgrade test (#747) ─────────────────────────────
  # Applies migration 00067 to a database that already holds listings, backfills in
  # batches, and asserts search and nearby search work and that the migration is
  # idempotent. Self-contained, so it does not depend on setup.sql.
  search-rollout-upgrade:
    name: Search Rollout Upgrade Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: supabase/postgres:15.6.1.117
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Run upgrade test for migration 00067
        working-directory: apps/backend/tests/db
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: ./run-search-rollout.sh

  # ─── Job 8: Documentation link check ────────────────────────────────────────
  # Verifies that all relative file paths referenced in Markdown docs exist in
  # the repository. Broken links (e.g. after a file rename) fail this job.
  docs-link-check:
    name: Documentation Link Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          # Only check local file links (skip external URLs to avoid flaky network failures)
          args: >
            --no-progress
            --exclude-loopback
            --include-verbatim
            --offline
            CONTRIBUTING.md
            README.md
            docs/**/*.md
            apps/backend/README.md
            apps/backend/database/README.md
            apps/backend/database/MIGRATIONS_NAMING.md
          fail: true

  # ─── Job 9: Backup restore drill (#736) ─────────────────────────────────────
  # Applies the restore fixture schema and sanitized seed data, then runs the
  # restore drill: encrypted export, checksum, isolated restore, and schema, RLS,
  # row-count and write-probe assertions. A truncated copy of the same backup must
  # be rejected. The scheduled workflow in restore-drill.yml runs the same script
  # against nonproduction infrastructure.
  restore-drill:
    name: Backup Restore Drill
    runs-on: ubuntu-latest

    services:
      postgres:
        image: supabase/postgres:15.6.1.117
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGPASSWORD: postgres
      PROD_DB_HOST: 127.0.0.1
      PROD_DB_USER: postgres
      PROD_DB_PASSWORD: postgres
      PROD_DB_NAME: rentars
      VERIFY_DB_HOST: 127.0.0.1
      VERIFY_DB_USER: postgres
      VERIFY_DB_PASSWORD: postgres
      DRILL_REPORT_DIR: restore-drill-reports
      DRILL_BACKUP_OUT: restore-drill-backups

    steps:
      - uses: actions/checkout@v4

      - name: Create source database and apply schema subset
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE rentars;'
          psql -h 127.0.0.1 -U postgres -d rentars -v ON_ERROR_STOP=1 \
            -f tests/fixtures/restore-drill/schema.sql

      - name: Load sanitized seed data
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d rentars -v ON_ERROR_STOP=1 \
            -f tests/fixtures/restore-drill/sanitized-seed.sql

      - name: Generate ephemeral backup key
        run: echo "BACKUP_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Run restore drill
        run: bash scripts/backup-restore-drill.sh

      - name: Reject a truncated backup
        run: |
          set -euo pipefail
          src="$(ls restore-drill-backups/*.dump.enc)"
          truncated="restore-drill-backups/truncated.dump.enc"
          size="$(stat -c %s "$src")"
          head -c "$((size / 2))" "$src" > "$truncated"
          cp "$src.sha256" "$truncated.sha256"
          if DRILL_SOURCE_BACKUP="$truncated" bash scripts/backup-restore-drill.sh; then
            echo "::error::restore drill accepted a truncated backup"
            exit 1
          fi
          echo "Truncated backup rejected as expected."

      - name: Upload drill reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-drill-reports
          path: restore-drill-reports/
          retention-days: 14
